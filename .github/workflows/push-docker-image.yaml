on:
  push:
    branches:
      - 'main'
      - 'feature/setup-ci-cd'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_TAG: ${{github.sha::6}}
      DOCKER_IMAGE: borisplaton/jira-mcp-server
    steps:
      - name: Check out repository content
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@da5b89b92c1be57a07eeed1334a0728b94145654
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          cd server/
          make build IMAGE="$DOCKER_IMAGE" IMAGE_TAG="$COMMIT_SHA"
          docker image tag "$DOCKER_IMAGE":"$COMMIT_SHA" "$DOCKER_IMAGE":latest

      - name: Push Docker image
        run: |
          cd server/
          make push-image IMAGE_TAG="$COMMIT_SHA"
          make push-image IMAGE_TAG=latest
